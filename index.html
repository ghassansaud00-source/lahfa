document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

#E6B866}\ninput,textarea{font-family:inherit}\ninput::placeholder,textarea::placeholder{color:rgba(245,239,230,.3)}\ninput[type=date]{color-scheme:dark}\n@keyframes br{0%,100%{transform:scale(.8);opacity:.45}40%{transform:scale(1.15);opacity:1}}\n<\u002Fstyle><title>لهفة<\u002Ftitle><link rel=\"icon\" type=\"image/png\" href=\"7ef69699-9dd1-4772-a640-d209fddcd58a\"><link rel=\"apple-touch-icon\" href=\"7ef69699-9dd1-4772-a640-d209fddcd58a\"><meta name=\"apple-mobile-web-app-title\" content=\"لهفة\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><\u002Fhelmet>\n\n\n<div dir=\"rtl\" style=\"max-width:440px;min-height:100dvh;margin:0 auto;background:#12100E;color:#F5EFE6;display:flex;flex-direction:column;position:relative\">\n\n<sc-if value=\"{{ isOnb }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:48px 26px 32px\">\n    <sc-if value=\"{{ onb0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px\">\n        <img src=\"9bcfb283-152d-4a2a-bc34-e70707641e66\" alt=\"لهفة\" style=\"width:64px;height:64px;object-fit:contain\">\n        <div style=\"font-family:Amiri,serif;font-size:44px;line-height:1.2\">لهفة<\u002Fdiv>\n        <div style=\"font-size:16px;line-height:1.9;color:rgba(245,239,230,.7);text-wrap:pretty\">رفيقك في التعافي، يوم بيوم. كل اللي تكتبه هنا يبقى على جهازك فقط.<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ onbNext }}\" style=\"background:#D4A04A;color:#1B1408;border-radius:999px;padding:17px;text-align:center;font-size:16px;font-weight:600;cursor:pointer\">ابدأ<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onb1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:26px\">\n        <div style=\"font-size:13px;color:#D4A04A\">١ من ٢<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:Amiri,serif;font-size:28px\">وش نناديك؟<\u002Fdiv>\n          <input value=\"{{ draftName }}\" sc-camel-on-change=\"{{ onDraftName }}\" placeholder=\"اسم أو لقب، ما يشوفه أحد\" style=\"background:#1C1916;border:1px solid rgba(245,239,230,.1);border-radius:16px;padding:16px;font-size:16px;color:#F5EFE6;outline:none\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:Amiri,serif;font-size:28px\">وش اللي تتعافى منه؟<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n            <sc-for list=\"{{ typeChips }}\" as=\"c\" hint-placeholder-count=\"4\"><div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ onbNext }}\" style=\"background:#D4A04A;color:#1B1408;border-radius:999px;padding:17px;text-align:center;font-size:16px;font-weight:600;cursor:pointer\">التالي<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ onb2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:26px\">\n        <div style=\"font-size:13px;color:#D4A04A\">٢ من ٢<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:Amiri,serif;font-size:28px\">متى بدأت تعافيك؟<\u002Fdiv>\n          <input type=\"date\" value=\"{{ draftStart }}\" max=\"{{ todayKey }}\" sc-camel-on-change=\"{{ onDraftStart }}\" style=\"background:#1C1916;border:1px solid rgba(245,239,230,.1);border-radius:16px;padding:16px;font-size:16px;color:#F5EFE6;outline:none\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font-family:Amiri,serif;font-size:28px\">ليش تبي تتعافى؟<\u002Fdiv>\n          <div style=\"font-size:14px;line-height:1.8;color:rgba(245,239,230,.55)\">اكتبها بكلامك. بنرجعها لك وقت الرغبة الملحة.<\u002Fdiv>\n          <textarea value=\"{{ draftReason }}\" sc-camel-on-change=\"{{ onDraftReason }}\" rows=\"4\" placeholder=\"ما أبي أكره نفسي كل صباح...\" style=\"background:#1C1916;border:1px solid rgba(245,239,230,.1);border-radius:16px;padding:16px;font-size:16px;line-height:1.8;color:#F5EFE6;outline:none;resize:none\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ finishOnb }}\" style=\"background:#D4A04A;color:#1B1408;border-radius:999px;padding:17px;text-align:center;font-size:16px;font-weight:600;cursor:pointer\">ابدأ رحلتي<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"flex:1;padding:22px 22px 110px\">\n    <div style=\"display:flex;align-items:center;gap:12px\">\n      <img src=\"9bcfb283-152d-4a2a-bc34-e70707641e66\" alt=\"لهفة\" style=\"width:34px;height:34px;object-fit:contain\">\n      <div style=\"flex:1\"><div style=\"font-size:16px;font-weight:600\">لهفة<\u002Fdiv><div style=\"font-size:13px;color:rgba(245,239,230,.5)\">{{ greeting }}<\u002Fdiv><\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goSettings }}\" style=\"width:44px;height:44px;border-radius:50%;border:1px solid rgba(245,239,230,.15);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:rgba(245,239,230,.7)\">⚙<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;align-items:center;margin-top:30px\">\n      <div style=\"position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center\">\n        <svg sc-camel-view-box=\"0 0 200 200\" style=\"position:absolute;inset:0;transform:rotate(-90deg)\"><circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"none\" stroke=\"rgba(212,160,74,.14)\" stroke-width=\"7\"><\u002Fcircle><circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"none\" stroke=\"#D4A04A\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-dasharray=\"578\" stroke-dashoffset=\"{{ ringOffset }}\"><\u002Fcircle><\u002Fsvg>\n        <div style=\"text-align:center\">\n          <div style=\"font-family:Amiri,serif;font-size:64px;line-height:1.5;height:84px;display:flex;align-items:center;justify-content:center;overflow:visible\">{{ daysAr }}<\u002Fdiv>\n          <div style=\"font-size:15px;color:#D4A04A;margin-top:10px\">{{ dayWord }}<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:rgba(245,239,230,.45);margin-top:4px\">{{ nextMile }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:28px\">\n      <div style=\"background:#1C1916;border-radius:16px;padding:14px 8px;text-align:center\"><div style=\"font-size:21px;font-weight:600\">{{ longestAr }}<\u002Fdiv><div style=\"font-size:12px;color:rgba(245,239,230,.5);margin-top:4px\">أطول فترة<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#1C1916;border-radius:16px;padding:14px 8px;text-align:center\"><div style=\"font-size:21px;font-weight:600;color:#D4A04A\">{{ urgesAr }}<\u002Fdiv><div style=\"font-size:12px;color:rgba(245,239,230,.5);margin-top:4px\">رغبة تجاوزتها<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#1C1916;border-radius:16px;padding:14px 8px;text-align:center\"><div style=\"font-size:21px;font-weight:600\">{{ logDaysAr }}<\u002Fdiv><div style=\"font-size:12px;color:rgba(245,239,230,.5);margin-top:4px\">يوم سجّلته<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ toggleTask }}\" style=\"background:#1C1916;border-radius:18px;padding:16px;margin-top:10px;display:flex;align-items:center;gap:14px;cursor:pointer\">\n      <div style=\"{{ taskBox }}\">{{ taskMark }}<\u002Fdiv>\n      <div style=\"flex:1\"><div style=\"font-size:12.5px;color:rgba(245,239,230,.5)\">مهمة اليوم<\u002Fdiv><div style=\"{{ taskText }}\">{{ task }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goLog }}\" style=\"background:#1C1916;border-radius:18px;padding:16px;margin-top:10px;display:flex;align-items:center;gap:14px;cursor:pointer\">\n      <div style=\"flex:1\"><div style=\"font-size:15px;font-weight:500\">{{ logCta }}<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(245,239,230,.5);margin-top:3px\">مودك ومحفّزاتك، دقيقة وحدة<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:18px;color:#D4A04A\">‹<\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goRelapse }}\" style=\"text-align:center;font-size:13px;color:rgba(245,239,230,.4);margin-top:26px;padding:12px;cursor:pointer\">صارت انتكاسة؟ سجّلها بدون لوم<\u002Fdiv>\n  <\u002Fdiv>\n  <div sc-camel-on-click=\"{{ startUrge }}\" style=\"position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:max(18px, calc(50% - 202px));background:#12100E;border:1px solid rgba(212,160,74,.5);color:#D4A04A;border-radius:999px;padding:13px 20px;font-size:14px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(0,0,0,.9);z-index:5\">رغبة ملحة<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLog }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;padding:28px 22px 110px;display:flex;flex-direction:column;gap:14px\">\n    <div><div style=\"font-family:Amiri,serif;font-size:32px\">سجل اليوم<\u002Fdiv><div style=\"font-size:13px;color:rgba(245,239,230,.5);margin-top:4px\">يبقى على جهازك فقط<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#1C1916;border-radius:18px;padding:16px\">\n      <div style=\"font-size:14px;color:rgba(245,239,230,.65);margin-bottom:12px\">مودك اليوم<\u002Fdiv>\n      <div style=\"display:flex;gap:7px\">\n        <sc-for list=\"{{ moodChips }}\" as=\"m\" hint-placeholder-count=\"5\"><div sc-camel-on-click=\"{{ m.onClick }}\" style=\"{{ m.style }}\"><div style=\"font-size:22px\">{{ m.e }}<\u002Fdiv><div style=\"font-size:11px\">{{ m.label }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1C1916;border-radius:18px;padding:16px\">\n      <div style=\"font-size:14px;color:rgba(245,239,230,.65);margin-bottom:12px\">وش المحفّزات اللي مرّت عليك؟<\u002Fdiv>\n      <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n        <sc-for list=\"{{ trigChips }}\" as=\"c\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1C1916;border-radius:18px;padding:16px\">\n      <div style=\"font-size:14px;color:rgba(245,239,230,.65);margin-bottom:10px\">تكتب شيء لنفسك؟<\u002Fdiv>\n      <textarea value=\"{{ logNote }}\" sc-camel-on-change=\"{{ onLogNote }}\" rows=\"4\" placeholder=\"اليوم كان فيه لحظة صعبة بس...\" style=\"width:100%;background:transparent;border:none;padding:0;font-size:15px;line-height:1.8;color:#F5EFE6;outline:none;resize:none\"><\u002Ftextarea>\n    <\u002Fdiv>\n    <div sc-camel-on-click=\"{{ saveLog }}\" style=\"background:#D4A04A;color:#1B1408;border-radius:999px;padding:16px;text-align:center;font-size:16px;font-weight:600;cursor:pointer\">احفظ تسجيل اليوم<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isProgress }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;padding:28px 22px 110px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"font-family:Amiri,serif;font-size:32px;margin-bottom:6px\">التقدم<\u002Fdiv>\n    <div style=\"background:#1C1916;border-radius:20px;padding:18px\">\n      <div style=\"font-size:14px;color:rgba(245,239,230,.6)\">الرغبات الملحّة حسب الوقت<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:16px\">\n        <sc-for list=\"{{ hourBars }}\" as=\"b\" hint-placeholder-count=\"8\"><div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%\"><div style=\"{{ b.style }}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;margin-top:8px\"><sc-for list=\"{{ hourBars }}\" as=\"b\" hint-placeholder-count=\"8\"><div style=\"flex:1;text-align:center;font-size:10.5px;color:rgba(245,239,230,.4)\">{{ b.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n      <div style=\"font-size:13.5px;line-height:1.8;color:rgba(245,239,230,.8);margin-top:14px\">{{ hourInsight }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1C1916;border-radius:20px;padding:18px\">\n      <div style=\"font-size:14px;color:rgba(245,239,230,.6)\">المود آخر ٧ أيام<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:8px;height:80px;margin-top:16px\">\n        <sc-for list=\"{{ moodBars }}\" as=\"b\" hint-placeholder-count=\"7\"><div style=\"flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%\"><div style=\"{{ b.style }}\"><\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px;margin-top:8px\"><sc-for list=\"{{ moodBars }}\" as=\"b\" hint-placeholder-count=\"7\"><div style=\"flex:1;text-align:center;font-size:11px;color:rgba(245,239,230,.4)\">{{ b.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px\">\n      <div style=\"background:#1C1916;border-radius:16px;padding:16px\"><div style=\"font-size:24px;font-weight:600;color:#D4A04A\">{{ urgesAr }}<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(245,239,230,.5);margin-top:4px\">رغبة ملحة عدّت<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#1C1916;border-radius:16px;padding:16px\"><div style=\"font-size:24px;font-weight:600\">{{ log30Ar }}<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(245,239,230,.5);margin-top:4px\">يوم سجّلته آخر ٣٠ يوم<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#1C1916;border-radius:16px;padding:16px\"><div style=\"font-size:24px;font-weight:600\">{{ helpAr }}<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(245,239,230,.5);margin-top:4px\">مرة طلبت مساعدة<\u002Fdiv><\u002Fdiv>\n      <div style=\"background:#1C1916;border-radius:16px;padding:16px\"><div style=\"font-size:24px;font-weight:600\">{{ relapsesAr }}<\u002Fdiv><div style=\"font-size:12.5px;color:rgba(245,239,230,.5);margin-top:4px\">انتكاسة ورجعت<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasTopTrig }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid rgba(212,160,74,.25);border-radius:16px;padding:16px;font-size:14px;line-height:1.8;color:rgba(245,239,230,.85)\">{{ topTrig }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isUrge }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"flex:1;display:flex;flex-direction:column;padding:22px 28px 36px;min-height:100dvh\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"align-self:flex-start;font-size:14px;color:rgba(245,239,230,.45);padding:10px 0;cursor:pointer\">إغلاق<\u002Fdiv>\n    <sc-if value=\"{{ urge0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center\">\n        <div style=\"position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center\">{{ breath }}<div style=\"width:104px;height:104px;border-radius:50%;border:1px solid rgba(212,160,74,.5);display:flex;align-items:center;justify-content:center;font-size:15px;color:#D4A04A;position:relative\">{{ breathPhase }}<\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family:Amiri,serif;font-size:30px;line-height:1.6;margin-top:36px;text-wrap:pretty\">تنفس وتذكر معاي كم انت قوي وشجاع وعديت كل شي لحد الان<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ skipBreath }}\" style=\"text-align:center;font-size:14px;color:#D4A04A;padding:14px;cursor:pointer\">{{ leftAr }} ثانية · تخطّي<\u002Fdiv>\n    <\u002Fsc-if>\n    <s Fdiv>\n    <div style=\"font-size:15px;color:rgba(245,239,230,.6);line-height:1.9;margin-bottom:8px\">نسجل اللي صار عشان نفهمه، مو عشان نحاسبك. {{ relapseKeep }}<\u002Fdiv>\n    <div style=\"background:#221C17;border-radius:18px;padding:16px\"><div style=\"font-size:14px;color:rgba(245,239,230,.6);margin-bottom:12px\">متى صار؟<\u002Fdiv><div style=\"display:flex;gap:8px\"><sc-for list=\"{{ whenChips }}\" as=\"c\" hint-placeholder-count=\"2\"><div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#221C17;border-radius:18px;padding:16px\"><div style=\"font-size:14px;color:rgba(245,239,230,.6);margin-bottom:12px\">وش اللي سبقها؟<\u002Fdiv><div style=\"display:flex;gap:8px;flex-wrap:wrap\"><sc-for list=\"{{ relTrigChips }}\" as=\"c\" hint-placeholder-count=\"6\"><div sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#221C17;border-radius:18px;padding:16px\"><div style=\"font-size:14px;color:rgba(245,239,230,.6);margin-bottom:10px\">وش تقول لنفسك بكرة الصباح؟<\u002Fdiv><textarea value=\"{{ relNote }}\" sc-camel-on-change=\"{{ onRelNote }}\" rows=\"3\" placeholder=\"جملة وحدة تكفي...\" style=\"width:100%;background:transparent;border:none;padding:0;font-size:15px;line-height:1.8;color:#F5EFE6;outline:none;resize:none\"><\u002Ftextarea><\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div sc-camel-on-click=\"{{ saveRelapse }}\" style=\"background:#D4A04A;color:#1B1408;border-radius:999px;padding:16px;text-align:center;font-size:16px;font-weight:600;cursor:pointer\">سجّل وابدأ من جديد<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ relapseCall }}\" style=\"text-align:center;font-size:14px;color:rgba(245,239,230,.5);padding:10px;cursor:pointer\">أو كلّم {{ mentor }} قبل ما تسجّل<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSettings }}\" hint-placeholder n<\u002Fsc-if>\n\n<sc-if value=\"{{ showTabs }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:sticky;bottom:0;display:flex;justify-content:space-around;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:rgba(18,16,14,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(245,239,230,.07);font-size:12px;z-index:4\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"min-width:64px;padding:6px;text-align:center;cursor:pointer;color:{{ tabHome }}\"><div style=\"font-size:19px\">◉<\u002Fdiv>الرئيسية<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goLog }}\" style=\"min-width:64px;padding:6px;text-align:center;cursor:pointer;color:{{ tabLog }}\"><div style=\"font-size:19px\">✎<\u002Fdiv>سجل اليوم<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ goProgress }}\" style=\"min-width:64px;padding:6px;text-align:center;cursor:pointer;color:{{ tabProg }}\"><div style=\"font-size:19px\">◴<\u002Fdiv>التقدم<\u002Fdiv>\n    <a href=\"{{ channelUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"min-width:64px;padding:6px;text-align:center;color:rgba(245,239,230,.45)\"><div style=\"font-size:19px\">◌<\u002Fdiv>المجتمع ↗<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#F5EFE6;color:#1B1408;border-radius:999px;padding:12px 20px;font-size:14px;font-weight:500;z-index:10;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);white-space:nowrap\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;mentorName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;غسان&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;التواصل&quot;},&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;96890196666&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;التو
